<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ادعيتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef4ff;
  --bg2:#fdf0f6;
  --bg3:#e8fbf5;
  --card: rgba(255,255,255,.52);
  --card-border: rgba(255,255,255,.75);
  --hdr: rgba(255,255,255,.5);
  --hdr-border: rgba(255,255,255,.6);
  --text:#1b1b22;
  --text2:#5d5d6e;
  --sep: rgba(60,60,67,.12);
  --accent:#0a84ff;
  --accent2:#7d5cff;
  --gold:#e0a93a;
  --accent-soft: rgba(10,132,255,.12);
  --glass-shadow: 0 10px 34px rgba(31,38,135,.10), 0 2px 8px rgba(31,38,135,.06);
  --glass-inset: inset 0 1px 0 rgba(255,255,255,.75);
  --glow: 0 0 26px rgba(10,132,255,.28);
  --radius:24px;
  --fs:19px;
  --ease: cubic-bezier(.2,.8,.3,1);
  --reveal: 1s;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#0a0e1a;
    --bg2:#150a1c;
    --bg3:#08171a;
    --card: rgba(30,30,42,.48);
    --card-border: rgba(255,255,255,.13);
    --hdr: rgba(16,16,24,.55);
    --hdr-border: rgba(255,255,255,.08);
    --text:#ffffff;
    --text2:#9c9cae;
    --sep: rgba(84,84,88,.32);
    --accent:#3da5ff;
    --accent2:#9d80ff;
    --gold:#f0c463;
    --accent-soft: rgba(61,165,255,.16);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    --glass-inset: inset 0 1px 0 rgba(255,255,255,.10);
    --glow: 0 0 30px rgba(61,165,255,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'SF Arabic','SF Pro Text',-apple-system,BlinkMacSystemFont,'Tajawal','Segoe UI',system-ui,sans-serif;
  background:var(--bg1);
  color:var(--text);
  font-size:var(--fs);
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== الخلفية المضيئة ===== */
.orbs{
  position:fixed; inset:0; z-index:-1; overflow:hidden;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%);
}
.orb{
  position:absolute; border-radius:50%; filter:blur(75px); opacity:.7;
  animation:float 20s ease-in-out infinite alternate;
  will-change:transform;
}
.orb.a{width:340px;height:340px;background:#7dabff;top:-90px;right:-70px;}
.orb.b{width:320px;height:320px;background:#ffb3e6;bottom:8%;left:-90px;animation-delay:-7s;}
.orb.c{width:280px;height:280px;background:#8ff0d0;top:42%;right:18%;animation-delay:-13s;}
@media (prefers-color-scheme: dark){
  .orb.a{background:#1b3bff;opacity:.5}
  .orb.b{background:#7a1bff;opacity:.45}
  .orb.c{background:#00a88f;opacity:.4}
}
@keyframes float{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(34px,46px) scale(1.18)}
}

/* ===== الترويسة الزجاجية ===== */
.hdr{
  position:sticky; top:0; z-index:50;
  background:var(--hdr);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--hdr-border);
  box-shadow:0 4px 30px rgba(31,38,135,.07);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  animation:fadeDown 1s var(--ease) both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}

.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.title{
  font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0;
  background:linear-gradient(120deg,var(--accent),var(--accent2) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(10,132,255,.35));
}
.counter{
  font-size:13px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);
  border:1px solid rgba(10,132,255,.25);
  padding:5px 13px;border-radius:100px;
  white-space:nowrap;
  box-shadow:0 0 16px rgba(10,132,255,.18);
  animation:fadeIn 1.2s var(--ease) .15s both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.search-wrap{position:relative;margin-bottom:10px;animation:fadeIn 1.2s var(--ease) .25s both}
.search-wrap svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
#q{
  width:100%;border:1px solid var(--card-border);outline:none;
  background:var(--card);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);
  border-radius:14px;padding:11px 40px 11px 40px;
  font-size:16px;font-family:inherit;
  transition:box-shadow .4s var(--ease), border-color .4s var(--ease), background .4s;
  box-shadow:var(--glass-inset);
}
#q::placeholder{color:var(--text2)}
#q:focus{border-color:rgba(10,132,255,.5);box-shadow:0 0 0 4px rgba(10,132,255,.14), var(--glass-inset)}
.clear-btn{
  position:absolute;inset-inline-end:9px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(118,118,128,.32);color:#fff;font-size:13px;
  display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1;
  transition:transform .25s var(--ease), background .25s;
}
.clear-btn:active{transform:translateY(-50%) scale(.85)}
.clear-btn.show{display:flex}

/* ===== الشرائح ===== */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none;
  scroll-snap-type:x proximity;
  animation:fadeIn 1.2s var(--ease) .35s both;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:start;
  border:1px solid var(--card-border);cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:500;
  padding:8px 16px;border-radius:100px;
  background:var(--card);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);
  box-shadow:var(--glass-inset);
  transition:transform .3s var(--ease), background .35s, color .35s, box-shadow .35s, border-color .35s;
  white-space:nowrap;
}
.chip:active{transform:scale(.9);box-shadow:0 0 20px rgba(10,132,255,.35)}
.chip.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;border-color:transparent;
  box-shadow:0 6px 22px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
}

/* ===== القائمة ===== */
main{
  padding:16px 16px 0;max-width:780px;margin:0 auto;
  position:relative;z-index:1;
}
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--card-border);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:var(--radius);
  padding:17px 19px 12px;
  margin-bottom:14px;
  box-shadow:var(--glass-shadow), var(--glass-inset);
  overflow:hidden;

  /* حركة الظهور التدريجي */
  opacity:0;
  transform:translateY(30px) scale(.985);
  transition:
    opacity var(--reveal) var(--ease),
    transform var(--reveal) var(--ease),
    box-shadow .5s var(--ease);
  transition-delay:calc(var(--i,0) * 55ms);
}
.card.in{
  opacity:1;
  transform:none;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 80% at 85% -10%, rgba(125,92,255,.16), transparent 60%);
}
.card-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;gap:8px;
}
.tag{
  font-size:11px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);
  border:1px solid rgba(10,132,255,.22);
  padding:3px 11px;border-radius:100px;
  letter-spacing:.2px;
  box-shadow:0 0 14px rgba(10,132,255,.15);
}
.num{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
.dua-text{
  font-size:var(--fs);
  line-height:2;
  font-weight:400;
  letter-spacing:.1px;
  margin:0 0 12px;
  word-break:break-word;
  text-align:justify;
  text-align-last:right;
  position:relative;
}
.actions{
  display:flex;gap:6px;border-top:1px solid var(--sep);
  padding-top:8px;margin-top:2px;position:relative;
}
.act{
  position:relative;overflow:hidden;
  flex:1;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--text2);
  padding:8px 4px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .28s var(--ease), background .3s var(--ease),
             color .3s var(--ease), box-shadow .3s var(--ease);
}
.act::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at center, rgba(10,132,255,.4), transparent 70%);
  opacity:0;transform:scale(.3);
  transition:opacity .45s var(--ease), transform .45s var(--ease);
}
.act:active{
  transform:scale(.9);
  background:rgba(10,132,255,.14);
  color:var(--accent);
  box-shadow:0 0 18px rgba(10,132,255,.3);
}
.act:active::after{
  opacity:1;transform:scale(1.15);
  transition:opacity .08s, transform .25s var(--ease);
}
.act.fav{color:#FF3B30}
.act svg{width:15px;height:15px;fill:currentColor;position:relative;z-index:1}
.act span{position:relative;z-index:1}

/* ===== زر المزيد ===== */
.more-wrap{display:flex;justify-content:center;padding:8px 0 22px;position:relative;z-index:1}
.more{
  border:1px solid var(--card-border);cursor:pointer;font-family:inherit;
  font-size:15px;font-weight:700;color:var(--accent);
  background:var(--card);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:13px 36px;border-radius:100px;
  box-shadow:var(--glass-shadow), var(--glass-inset);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.more:active{transform:scale(.94);box-shadow:0 0 26px rgba(10,132,255,.4)}

/* ===== فارغ ===== */
.empty{
  text-align:center;padding:60px 20px;color:var(--text2);font-size:16px;
  animation:fadeIn .9s var(--ease) both;
}
.empty .big{font-size:48px;display:block;margin-bottom:12px;opacity:.6}

/* ===== الزر العائم ===== */
.fab{
  position:fixed;
  inset-inline-end:18px;
  bottom:calc(22px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.45);cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  z-index:60;
  animation:fabPulse 3.2s ease-in-out infinite;
}
@keyframes fabPulse{
  0%,100%{box-shadow:0 10px 30px rgba(10,132,255,.45), 0 0 0 0 rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.4)}
  50%{box-shadow:0 10px 30px rgba(10,132,255,.45), 0 0 0 14px rgba(10,132,255,0), inset 0 1px 0 rgba(255,255,255,.4)}
}
.fab:active{transform:scale(.88);box-shadow:0 0 40px rgba(10,132,255,.7)}

/* ===== التوست ===== */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px) scale(.95);
  background:rgba(20,20,28,.75);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#fff;font-size:14px;font-weight:600;
  padding:12px 24px;border-radius:100px;
  opacity:0;pointer-events:none;
  transition:all .45s var(--ease);
  z-index:99;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ===== النافذة الزجاجية ===== */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,14,30,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;
  transition:opacity .45s var(--ease);
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  position:relative;
  background:var(--card);
  border:1px solid var(--card-border);
  backdrop-filter:blur(34px) saturate(180%);
  -webkit-backdrop-filter:blur(34px) saturate(180%);
  border-radius:28px;
  padding:28px 24px 20px;max-width:520px;width:100%;
  transform:scale(.88) translateY(14px);
  transition:transform .55s var(--ease);
  box-shadow:0 30px 70px rgba(0,0,0,.28), var(--glass-inset);
  max-height:80vh;overflow:auto;
}
.overlay.show .modal{transform:scale(1) translateY(0)}
.modal .tag{margin-bottom:16px;display:inline-block}
.modal p{font-size:20px;line-height:2;margin:0 0 22px}
.modal-actions{display:flex;gap:8px}
.modal-actions button{
  flex:1;border:none;font-family:inherit;font-size:15px;font-weight:700;
  padding:14px;border-radius:16px;cursor:pointer;
  transition:transform .28s var(--ease), box-shadow .3s var(--ease);
}
.modal-actions button:active{transform:scale(.93)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 24px rgba(10,132,255,.4);
}
.btn-primary:active{box-shadow:0 0 30px rgba(10,132,255,.7)}
.btn-ghost{
  background:rgba(118,118,128,.16);color:var(--text);
  border:1px solid var(--card-border);
}

/* ===== التذييل ===== */
.foot{
  text-align:center;font-size:12px;color:var(--text2);
  padding:6px 24px 12px;line-height:1.9;position:relative;z-index:1;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="orbs">
  <span class="orb a"></span>
  <span class="orb b"></span>
  <span class="orb c"></span>
</div>

<header class="hdr">
  <div class="hdr-top">
    <h1 class="title">ادعيتي</h1>
    <div class="counter" id="counter">٠ دعاء</div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث في الأدعية…" autocomplete="off">
    <button class="clear-btn" id="clearBtn" aria-label="مسح">✕</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>
<div class="more-wrap" id="moreWrap"></div>

<div class="foot">
  الأدعية من القرآن الكريم والسنة النبوية الصحيحة<br>
  يُستحسن مراجعة المصادر للتأكد • صُنع بـ ❤️
</div>

<button class="fab" id="fab" aria-label="دعاء عشوائي">🎲</button>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <span class="tag" id="mTag"></span>
    <p id="mText"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="mCopy">نسخ</button>
      <button class="btn-ghost" id="mClose">إغلاق</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   قاعدة البيانات — 20 تصنيفًا × 50 دعاء = 1000 دعاء
   ========================================================= */
const CATS = [
"أدعية قرآنية",
"أدعية نبوية",
"الاستغفار والتوبة",
"الرزق والبركة",
"الصحة والشفاء",
"الهم والكرب",
"الوالدين والأهل",
"الذرية والزواج",
"العلم والهداية",
"الجنة والآخرة",
"الخوف والوسواس",
"السفر والحفظ",
"الطعام والشراب",
"النوم والصباح والمساء",
"الصلاة والعبادة",
"الشكر والحمد",
"المغفرة والرحمة",
"الصبر والثبات",
"الخير والبركة",
"أدعية جامعة"
];

const DATA = [
/* ---------- 1: أدعية قرآنية ---------- */
[
"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
"رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا",
"رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا",
"رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا",
"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ",
"رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ",
"رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ",
"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ",
"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي",
"رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ",
"رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ",
"رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",
"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",
"رَبِّ زِدْنِي عِلْمًا",
"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",
"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا",
"رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَامًا",
"رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا",
"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي",
"رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ",
"رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ",
"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ",
"رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ",
"رَبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ",
"لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
"رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ",
"رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ",
"رَبَّنَا لَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا",
"رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَارْزُقْ أَهْلَهُ مِنَ الثَّمَرَاتِ",
"رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَّحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ",
"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ",
"رَبَّنَا اكْشِفْ عَنَّا الْعَذَابَ إِنَّا مُؤْمِنُونَ",
"رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ",
"رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْبًا وَلَمْ أَكُن بِدُعَائِكَ رَبِّ شَقِيًّا",
"رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ",
"رَبِّ أَنزِلْنِي مُنزَلًا مُّبَارَكًا وَأَنتَ خَيْرُ الْمُنزِلِينَ",
"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ",
"رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ",
"رَبَّنَا لَا تُؤَاخِذْنَا بِمَا فَعَلَ السُّفَهَاءُ مِنَّا",
"رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ",
"رَبَّنَا آتِنَا الصَّبْرَ وَتَوَفَّنَا مُسْلِمِينَ",
"رَبِّ اجْعَلْ لِّي آيَةً",
"رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً",
"رَبِّ لَا تَذَرْ عَلَى الْأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا",
"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ",
"رَبِّ اشْرَحْ لِي صَدْرِي",
"رَبَّنَا أَخْرِجْنَا مِنْ هَٰذِهِ الْقَرْيَةِ الظَّالِمِ أَهْلُهَا"
],

/* ---------- 2: أدعية نبوية ---------- */
[
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ",
"اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ",
"اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ",
"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي",
"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ",
"اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",
"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ وَالْعَزِيمَةَ عَلَى الرُّشْدِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ",
"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْفِرْدَوْسَ الْأَعْلَى",
"اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ وَقَلْبٍ لَا يَخْشَعُ",
"اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي",
"اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي",
"اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّكَ أَنْتَ اللَّهُ الْأَحَدُ الصَّمَدُ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلَّا أَنْتَ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ",
"اللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا تَحُولُ بِهِ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ",
"اللَّهُمَّ اجْعَلْ أَوْسَعَ رِزْقِكَ عَلَيَّ عِنْدَ كِبَرِ سِنِّي",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الصِّحَّةَ وَالْعِفَّةَ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ",
"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي",
"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْيُسْرَ بَعْدَ الْعُسْرِ",
"اللَّهُمَّ لَا تَجْعَلْ مُصِيبَتَنَا فِي دِينِنَا",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ",
"اللَّهُمَّ أَغْنِنِي بِعِلْمِكَ وَزَيِّنِّي بِحِلْمِكَ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ",
"اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ عَزِيمَةَ الْخَيْرِ",
"اللَّهُمَّ بَلِّغْنِي رَمَضَانَ وَأَعِنِّي فِيهِ عَلَى الصِّيَامِ وَالْقِيَامِ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ وَحُبَّ مَنْ يُحِبُّكَ",
"اللَّهُمَّ أَعْطِنِي مِنَ الدُّنْيَا مَا يُبَلِّغُنِي إِلَى الْآخِرَةِ",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ وَالْأَعْمَالِ",
"اللَّهُمَّ اقْضِ عَنِّي الدَّيْنَ وَأَغْنِنِي مِنَ الْفَقْرِ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ سَعَةَ الرِّزْقِ وَطِيبَ الْعَيْشِ",
"اللَّهُمَّ ثَبِّتْ قَلْبِي عَلَى دِينِكَ",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ كُلِّ خَيْرٍ عَاجِلٍ وَآجِلٍ"
],

/* ---------- 3: الاستغفار والتوبة ---------- */
[
"أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ",
"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ",
"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَسِرَّهُ وَعَلَانِيَتَهُ",
"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",
"اللَّهُمَّ إِنِّي أَسْتَغْفِرُكَ لِكُلِّ ذَنْبٍ أَذْنَبْتُهُ عَمْدًا أَوْ خَطَأً",
"رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا",
"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ",
"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",
"اللَّهُمَّ طَهِّرْنِي مِنَ الذُّنُوبِ كَمَا يُطَهَّرُ الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ",
"اللَّهُمَّ اغْسِلْ خَطَايَايَ بِمَاءِ الثَّلْجِ وَالْبَرَدِ",
"اللَّهُمَّ إِنِّي أَتُوبُ إِلَيْكَ تَوْبَةَ نَصُوحًا",
"رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ تَوْبَةً قَبْلَ الْمَوْتِ",
"اللَّهُمَّ اجْعَلْ خَيْرَ عُمُرِي آخِرَهُ",
"اللَّهُمَّ لَا تُخْزِنِي يَوْمَ تُبْعَثُونَ",
"رَبَّنَا إِنَّكَ تَعْلَمُ مَا نُخْفِي وَمَا نُعْلِنُ",
"اللَّهُمَّ إِنِّي أَعْتَذِرُ إِلَيْكَ مِنْ كُلِّ ذَنْبٍ",
"اللَّهُمَّ اقْبَلْ تَوْبَتِي وَاغْسِلْ حَوْبَتِي",
"اللَّهُمَّ إِنِّي أَسْأَلُكَ صِدْقَ التَّوْبَةِ وَثَبَاتَ الْقَلْبِ",

"اللَّهُمَّ لَا تَخْذُلْنِي فِي مَوْقِفٍ",
"اللَّهُمَّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ",
"اللَّهُمَّ أَنْصِرْنِي وَلَا تَنْصُرْ عَلَيَّ",
"اللَّهُمَّ ارْزُقْنِي الْهُدَى وَالتُّقَى",
"اللَّهُمَّ اخْتِمْ لِي بِالْخَيْرِ",
"اللَّهُمَّ اجْعَلْ لِي فِي كُلِّ خَيْرٍ نَصِيبًا",
"اللَّهُمَّ لَا تَحْرِمْنِي خَيْرَ مَا عِنْدَكَ"
]
];

/* ============ تحويل البيانات ============ */
const ALL = [];
DATA.forEach((arr, ci) => {
  arr.forEach(txt => {
    ALL.push({ id: ALL.length, cat: ci, catName: CATS[ci], text: txt });
  });
});

/* ============ الحالة ============ */
const PAGE = 25;
let state = { q: "", cat: -1, favOnly: false, shown: PAGE };
let favs = new Set(JSON.parse(localStorage.getItem("dua_favs") || "[]"));

const $list = document.getElementById("list");
const $chips = document.getElementById("chips");
const $q = document.getElementById("q");
const $clear = document.getElementById("clearBtn");
const $counter = document.getElementById("counter");
const $moreWrap = document.getElementById("moreWrap");
const $toast = document.getElementById("toast");

/* ============ أدوات ============ */
function toArabic(n){
  return String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
}
function showToast(msg){
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => $toast.classList.remove("show"), 1800);
}
async function copyText(t){
  try{
    await navigator.clipboard.writeText(t);
    showToast("تم النسخ ✓");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    showToast("تم النسخ ✓");
  }
}

/* ============ مراقب الظهور التدريجي ============ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if(en.isIntersecting){
      en.target.classList.add("in");
    } else {
      en.target.classList.remove("in");
    }
  });
}, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

function observeCards(){
  document.querySelectorAll(".card").forEach(c => io.observe(c));
}

/* ============ شرائح التصنيفات ============ */
function buildChips(){
  const frag = document.createDocumentFragment();
  const mk = (label, cat, fav) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.dataset.cat = cat;
    b.dataset.fav = fav ? "1" : "";
    if(cat === state.cat && !fav) b.classList.add("on");
    b.onclick = () => {
      state.cat = cat; state.favOnly = fav; state.shown = PAGE;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      b.classList.add("on");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    frag.appendChild(b);
  };
  mk("الكل", -1, false);
  mk("❤️ المفضلة", -2, true);
  CATS.forEach((c, i) => mk(c, i, false));
  $chips.innerHTML = "";
  $chips.appendChild(frag);
  $chips.firstElementChild.classList.add("on");
}

/* ============ الفلترة ============ */
function filtered(){
  const q = state.q.trim();
  return ALL.filter(d => {
    if(state.favOnly){ if(!favs.has(d.id)) return false; }
    else if(state.cat >= 0 && d.cat !== state.cat) return false;
    if(q){
      if(!d.text.includes(q) && !d.catName.includes(q)) return false;
    }
    return true;
  });
}

/* ============ العرض ============ */
const ICON_COPY = '<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24"><path d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.4l7.05-4.11A3 3 0 1 0 15 5c0 .16.01.32.04.47L8.04 9.6a3 3 0 1 0 0 4.8l7.05 4.12c-.03.15-.04.3-.04.46a2.96 2.96 0 1 0 2.95-2.9z"/></svg>';
const ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21z"/></svg>';
const ICON_HEART_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7.5-4.6-7.5-9.7A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.9C19.5 15.4 12 20 12 20z"/></svg>';

function render(){
  const items = filtered();
  const slice = items.slice(0, state.shown);

  $counter.textContent = toArabic(items.length) + " دعاء";

  if(!slice.length){
    $list.innerHTML = '<div class="empty"><span class="big">🕌</span>لا توجد أدعية مطابقة</div>';
    $moreWrap.innerHTML = "";
    return;
  }

  let html = "";
  slice.forEach((d, i) => {
    const isFav = favs.has(d.id);
    html += `<article class="card" style="--i:${Math.min(i,8)}" data-id="${d.id}">
      <div class="card-top">
        <span class="tag">${d.catName}</span>
        <span class="num">${toArabic(d.id + 1)}</span>
      </div>
      <p class="dua-text">${d.text}</p>
      <div class="actions">
        <button class="act copy" data-act="copy">${ICON_COPY}<span>نسخ</span></button>
        <button class="act share" data-act="share">${ICON_SHARE}<span>مشاركة</span></button>
        <button class="act ${isFav?'fav':''}" data-act="fav">${isFav?ICON_HEART:ICON_HEART_O}<span>${isFav?'محفوظ':'حفظ'}</span></button>
      </div>
    </article>`;
  });
  $list.innerHTML = html;
  observeCards();

  if(items.length > state.shown){
    const left = items.length - state.shown;
    $moreWrap.innerHTML = `<button class="more">عرض المزيد (${toArabic(left)})</button>`;
    $moreWrap.querySelector(".more").onclick = () => {
      state.shown += PAGE;
      render();
    };
  } else {
    $moreWrap.innerHTML = "";
  }
}

/* ============ أحداث القائمة ============ */
$list.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const card = btn.closest(".card");
  const id = Number(card.dataset.id);
  const dua = ALL[id];
  const act = btn.dataset.act;

  if(act === "copy"){
    copyText(dua.text);
  } else if(act === "share"){
    const shareData = { title: "دعاء", text: dua.text + "\n\n— من تطبيق ادعيتي" };
    if(navigator.share){
      navigator.share(shareData).catch(()=>{});
    } else {
      copyText(shareData.text);
    }
  } else if(act === "fav"){
    if(favs.has(id)){ favs.delete(id); showToast("أُزيل من المفضلة"); }
    else { favs.add(id); showToast("أُضيف إلى المفضلة ❤️"); }
    localStorage.setItem("dua_favs", JSON.stringify([...favs]));
    render();
  }
});

/* ============ البحث ============ */
$q.addEventListener("input", () => {
  state.q = $q.value;
  state.shown = PAGE;
  $clear.classList.toggle("show", !!$q.value);
  render();
});
$clear.onclick = () => {
  $q.value = ""; state.q = ""; state.shown = PAGE;
  $clear.classList.remove("show");
  render(); $q.focus();
};

/* ============ دعاء عشوائي ============ */
const $overlay = document.getElementById("overlay");
const $mText = document.getElementById("mText");
const $mTag = document.getElementById("mTag");
let currentRandom = null;

document.getElementById("fab").onclick = () => {
  currentRandom = ALL[Math.floor(Math.random() * ALL.length)];
  $mTag.textContent = currentRandom.catName;
  $mText.textContent = currentRandom.text;
  $overlay.classList.add("show");
};
document.getElementById("mClose").onclick = () => $overlay.classList.remove("show");
$overlay.addEventListener("click", e => { if(e.target === $overlay) $overlay.classList.remove("show"); });
document.getElementById("mCopy").onclick = () => {
  if(currentRandom) copyText(currentRandom.text);
};

/* ============ بدء التشغيل ============ */
buildChips();
render();
console.log("إجمالي الأدعية:", ALL.length);
</script>
</body>
</html>
